<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chart Lab</title>
  <link href="styles/style.css" rel="stylesheet" type="text/css" />
  <script src="scripts/chart.js" type="text/javascript" defer></script>
</head>
<body class="theme-dark">
  <main class="app">
    <header class="topbar">
      <h1>Real-Time Chart</h1>

      <div class="controls">
        <button id="toggleRun" type="button">⏸ Pause</button>

        <label class="ctl">
          <span>Speed (ms)</span>
          <input id="speed" type="range" min="100" max="2000" step="50" value="1000" />
          <span class="ctlValue" id="speedValue">1000</span>
        </label>

        <label class="ctl">
          <span>Min</span>
          <input id="minVal" type="number" value="0" />
        </label>

        <label class="ctl">
          <span>Max</span>
          <input id="maxVal" type="number" value="600" />
        </label>

        <label class="ctl inline">
          <input id="toggleGrid" type="checkbox" checked />
          <span>Grid</span>
        </label>

        <label class="ctl inline">
          <input id="toggleSmooth" type="checkbox" />
          <span>Smoothing</span>
        </label>

        <label class="ctl">
          <span>Smooth window</span>
          <input id="smoothWindow" type="range" min="1" max="25" step="1" value="7" />
          <span class="ctlValue" id="smoothValue">7</span>
        </label>

        <label class="ctl">
          <span>Chart type</span>
          <select id="chartType">
            <option value="line" selected>Line</option>
            <option value="area">Area</option>
            <option value="bar">Bar</option>
            <option value="scatter">Scatter</option>
          </select>
        </label>

        <label class="ctl">
          <span>Theme</span>
          <select id="theme">
            <option value="theme-dark" selected>Dark</option>
            <option value="theme-light">Light</option>
            <option value="theme-contrast">High Contrast</option>
          </select>
        </label>

        <button id="reset" type="button">🔄 Reset</button>
        <button id="exportPng" type="button">⬇ Export PNG</button>
      </div>
    </header>

    <section class="content">
      <div class="canvasWrap">
        <canvas id="chartCanvas" width="900" height="600"></canvas>
        <div id="tooltip" class="tooltip" style="display:none;"></div>
      </div>

      <aside class="statsPanel">
        <h2>Statistics</h2>
        <div id="stats"></div>
      </aside>
    </section>
  </main>
</body>
</html>
